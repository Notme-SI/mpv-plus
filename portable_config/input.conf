# Keyboard seeking uses the same timeline as the player controls.
LEFT no-osd seek -5 relative; script-binding uosc/flash-timeline
RIGHT no-osd seek 5 relative; script-binding uosc/flash-timeline
UP no-osd seek 60 relative; script-binding uosc/flash-timeline
DOWN no-osd seek -60 relative; script-binding uosc/flash-timeline

# Show the uosc volume slider when scrolling over the video.
WHEEL_UP no-osd add volume 1; script-binding uosc/flash-volume
WHEEL_DOWN no-osd add volume -1; script-binding uosc/flash-volume

MBTN_RIGHT script-binding uosc/menu
MENU script-binding uosc/menu
Ctrl+p script-binding uosc/menu
Alt+p cycle ontop
Alt+з cycle ontop
C script-binding autocrop/toggle_auto
С script-binding autocrop/toggle_auto

# cycle pause #! Пауза / Воспроизведение
